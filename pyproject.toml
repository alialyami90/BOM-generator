[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bomgen"
version = "0.0.1"
description = "Generates the substation SCADA / PSA BOM workbook (.xlsx) from a device library, panel definitions and project settings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Ali Alyami" }]
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-PyYAML",
    "types-openpyxl",
]

# The `bomgen` console script is added with the CLI (see docs/plan.md, milestone M1).

[tool.hatch.build.targets.wheel]
packages = ["src/bomgen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "golden: reproduces the spec's example project values",
]
