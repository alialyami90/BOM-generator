[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bomgen"
version = "0.3.3"
description = "Generates the substation SCADA / PSA BOM workbook (.xlsx) from a device library, panel definitions and project settings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Ali Alyami" }]
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",  # round-trip edits that keep comments (ADR 0021)
    "typer>=0.12",
    "XlsxWriter>=3.2",
]

[project.optional-dependencies]
# The desktop app window (plan M10, ADR 0007); the CLI does not need it.
app = [
    "pywebview>=6.2,<7",
]
dev = [
    "mypy>=1.10",
    # Evaluates the written workbook's formulas in the golden tests (Q15).
    "pycel>=1.0b30",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-PyYAML",
    "types-openpyxl",
]

[project.scripts]
bomgen = "bomgen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bomgen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# XlsxWriter ships no type information (ADR 0003); only bomgen.writer imports it.
module = ["xlsxwriter", "xlsxwriter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pycel ships no type information; only the golden workbook test imports it.
module = ["pycel", "pycel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "golden: reproduces the spec's example project values",
]
