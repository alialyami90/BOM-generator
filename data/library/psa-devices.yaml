catalogues:
  enclosure_u: 42  # rack units of the standard enclosure (ADR 0013)
  mcb:  # spec: Derivation rules -> Breaker part numbers
    family: "Acti9 2P"  # ASSUMED
    make: Schneider
    poles: 2
    ratings_a: [1, 2, 6, 10, 16]
    code_pattern: "A9F742{rating:02d}"
    trip_curve: C  # M14: device-db MCB-* records
    magnetic_trip_multiple: 6.4
    magnetic_trip_multiple_dc: 9.05
    dc_rating_v: 125  # iC60N 2P: 10 kA at <= 125 V DC (data/device-db/electrical.yaml)

  aux_contact:  # 'Panel 1'!E33:G33 and E63:G63
    make: Schneider
    model: A9A26924
    ordering_code: A9A26924

  terminal_blocks:  # 'Panel 1'!E65:G74
    UT-16: { make: Phoenix, ordering_code: "3044199" }
    UT-2.5-MTD: { make: Phoenix, ordering_code: "3064085" }
    UT-2.5-MT: { make: Phoenix, ordering_code: "3046362" }

  busbars:  # tag = column B of the grounding row
    ac_safety_ground:  # 'Panel 1'!B76:C76
      tag: "AC SAFETY POWER-GROUND"
      description: |-
        POWER/AC SAFETY GROUNDING BUSBAR - TINNED COPPER
        For all exposed metal surfaces of cabinets, racks, chassis ground.
        Wire type: 14AWG, Green with yellow tracer insulation
    instrument_ground:  # 'Panel 1'!B77:C77 (trailing space after line 1 trimmed)
      tag: "INSTRUMENT-GROUND"
      description: |-
        INSTRUMENT GROUNDING BUSBAR - TINNED COPPER
        For all wire shields and DC common
        Wire type: 14AWG, Green insulation
    power_ground:  # 'Aux'!B45:C45 (WS console)
      tag: "POWER-GROUND"
      description: |-
        Power Safety Grounding Busbar-Tinned Copper
        Interface: For all exposed metal surfaces of cabinets, racks, and chassis ground.
        Wire Type: Wire type: min. 14AWG, Green with yellow tracer insulation

  housekeeping:  # part ids of the group D records above (ADR 0010 item 1)
    lamp: { part_id: SZ2500-LAMP }
    # no door_switch: the lamp part includes it (SZ 2500.210, SZ 2500.470)
    fan: { part_id: SK3243-FAN, airflow_m3h: 460 }  # override (data/library/additions.yaml)
    larger_fans:  # override (data/library/additions.yaml)
      - { part_id: SK3244-FAN-EC, airflow_m3h: 485 }
      - { part_id: SK3244-FAN, airflow_m3h: 520 }
    vent_filter: { part_id: SK3238-FILTER }
    thermostat: { part_id: SK3110-TH }
    ipr_kit: { part_id: IPR-2903685 }
    change_over_diodes: { negative: COD-NEG-IRND150F12, positive: COD-POS-IRMD150F12 }
    socket: { part_id: SOCKET-730076, rating_a: 10 }
    nameplate: { part_id: NAMEPLATE-0828805 }  # ADR 0026

