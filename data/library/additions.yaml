# Parts and MCB brand sets the shipped psa-devices library adds to the example library
# (plan Q38: the example stays the spec's example project). data/library/build.py appends
# them after the example's. The MCB sets come from the delivery's mcbs.csv (Hager MCB
# catalogue in VD-EL0009-007). Each part comes from the contractor's 2026-10-31 delivery
# (data/device-db/contractor-2026-10-31/: devices.csv, device_ports.csv, and sources.csv for
# every value); the comment names the document behind its model and power.
# No datasheet states a purdue_level: the switches' levels are a design call (plan M28), L2
# for those with 10G uplinks and L1 for the 1G bay switches. Ports as delivered, management
# ports included.
