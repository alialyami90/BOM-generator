# MCB brand sets the shipped library adds to the example's (contractor delivery, mcbs.csv:
# Hager MCB catalogue in VD-EL0009-007, pp. 345-363). Hager's ordering pages give no DC
# rating, so these sets have no dc_rating_v: a project refuses one as mcb_dc, and one chosen
# as mcb with mcb_dc unset also feeds the DC branches, which the check report warns about.
catalogue_brands:
  mcb:
    - id: hager-mcn-2p
      family: MCN 2P C 6 kA  # VD-EL0009-007 p. 347 (MCN201 to MCN216)
      make: Hager
      poles: 2
      ratings_a: [1, 2, 6, 10, 16]
      code_pattern: "MCN2{rating:02d}"
      trip_curve: C
    - id: hager-ncn-2p
      family: NCN 2P C 10 kA  # VD-EL0009-007 p. 356 (NCN201A to NCN216A)
      make: Hager
      poles: 2
      ratings_a: [1, 2, 6, 10, 16]
      code_pattern: "NCN2{rating:02d}A"
      trip_curve: C
