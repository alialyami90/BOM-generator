catalogue_brands:
  mcb:
    - id: hager-mcn-2p  # AC set: Hager gives no DC rating, so no dc_rating_v
      family: MCN 2P C 6 kA  # VD-EL0009-007 p. 347 (MCN201 to MCN216)
      make: Hager
      poles: 2
      ratings_a: [1, 2, 6, 10, 16]
      code_pattern: "MCN2{rating:02d}"
      trip_curve: C
    - id: hager-ncn-2p  # also DC rated, poles in series (contractor v2 mcb_ratings.csv)
      family: NCN 2P C 10 kA  # VD-EL0009-007 p. 356 (NCN201A to NCN216A)
      make: Hager
      poles: 2
      ratings_a: [1, 2, 6, 10, 16]
      code_pattern: "NCN2{rating:02d}A"
      trip_curve: C
      magnetic_trip_multiple_dc: 7  # C curve on DC: 7 to 15 In (Hager Protection devices catalogue p. 93)
      dc_rating_v: 250  # 6 kA at 250 V, 15 kA at 125 V, 20 kA to 60 V (p. 93)
overrides:  # values the shipped library changes in the example's parts and catalogues
  devices:
    SK3110-TH:  # plan Q29: "30 W" is the contact's DC switching limit; it draws nothing
      description_template: "Thermostat"
      unit_power_w: 0
    SK3243-FAN:  # plan Q29: the 60 Hz figure with one SK 3243.200 outlet filter
      description_template: "230V AC Inlet and Exhaust Fan, Throughput: 460 m3/h with outlet filter, 87W"
    SK3238-FILTER:  # plan Q29: the outlet filter that fits the SK 3243.100 fan
      model: "SK 3243.200"
      ordering_code: "SK 3243.200"
    NAP-K55:  # wall mounted: no rack space (data/device-db, contractor v2)
      height_u: 0
  catalogues:
    housekeeping:
      fan:  # plan Q29: per fan, with the SK 3243.200 outlet filter at 60 Hz
        airflow_m3h: 460
      # ADR 0029: per fan, 60 Hz, one SK 3243.200 outlet filter (the same cut-out). SK 3245.500
      # (630 m3/h) is left out: IP 51 would lower the cabinet's rating; add it if a project accepts that.
      larger_fans:
        - { part_id: SK3244-FAN-EC, airflow_m3h: 485 }
        - { part_id: SK3244-FAN, airflow_m3h: 520 }
