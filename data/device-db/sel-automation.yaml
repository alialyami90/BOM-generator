    summary: 3U rugged x86 (Intel Xeon) RTAC used as a multi-protocol gateway / logic processor with optional
      local HMI
    power:
      input: 120/240 VAC or 125/250 VDC, and/or 48 VDC; 50/60 Hz (SEL-9331A range 100-300 VDC / 85-264
        VAC)
