    ratings:
      cpu: 2.0 GHz Intel Xeon quad-core, up to 16 GB RAM, 30-480 GB storage
      expansion_slots: up to 5 (1 legacy PCI, 2 x PCIe x1, 2 x PCIe x4)
      alarm_contact: Form C digital output (alarm)
      conformal_coating: optional
    ports:
    - 'ETH1: 10/100/1000 Mbps (Intel I219LM)'
    - 'ETH2: 10/100/1000 Mbps (Intel I210IT)'
    - up to 8 more Ethernet ports via SEL-3390E4 PCIe cards (copper or LC fiber SFP)
    - 2 x EIA-232 (DB-9), 300-115200 bps
    - 6 x EIA-232/422/485 (RJ45), 300-921600 bps
    - up to 18 more EIA-232/422/485 ports via SEL-3390S8 cards
    - 4 rear + 2 front USB 3.1
    - IRIG-B demodulated input (RJ45, via SEL-3390S8 card)
    - 'video: DVI-D and DisplayPort (3 independent displays)'
    rack_units: 3
    weight_kg: 9.07
    mounting: 19-inch rack or panel (3U)
    operating_temp_c:
      min: -40
      max: 75
    ordering_code_decoded:
      '3555': SEL-3555 base model
      '#0KVC': SEL configured-part suffix (4-character hash generated by SEL's online Model Option Table/configurator).
        It does not map to option positions; the full option string is only visible in SEL's configurator
        or on the order acknowledgement. Not decodable from public literature.
    datasheet_url: https://selinc.com/api/download/107948
    product_url: https://selinc.com/products/3555/
    notes: Power consumption is not published in the flyer or catalog; BOM value 62 W for this configuration
      is unverified (another SEL-3555 in this BOM, 3555#F2R2, is carried at 73 W, which points to a different
      hardware build such as expansion cards or a dual PSU). Redundant supply is the SEL-9331 (12.1 VDC,
      200 W output). The flyer and catalog list no IEC 61850-3 / IEEE 1613 type tests for the SEL-3555
      (they do for SEL-3355 and SEL-2488), so certifications are left empty; ask SEL if the spec requires
      them. The 6 RJ45 serial ports are what the SEL-C607 cables in this BOM connect to.
    mounting_kind: rack
    height_u: 3
    height_note: 3U rack/panel mount (SEL Automation catalog)
    inrush_a: 20
    inrush_basis: datasheet
    inrush_note: 'SEL-3555 data sheet PDS3555-01 (date code 20221221), SEL-9331 160 W supply, high-voltage
      option 125/250 Vdc or 120/220/240 Vac: ''DC Range: 100-300 Vdc'', ''Maximum Constant Burden: 155
      W, 160 VA'', ''Maximum Peak Burden: 240 W, 248 VA'', ''Peak Inrush: 20 A'', ''Maximum DC Dropout:
      88 Vdc''. Per PSU; with the redundant second SEL-9331 each feed sees 20 A. (48 Vdc option: 38-58
      Vdc, 149 W, 20 A.)'
    input_v_min: 100
    input_v_max: 300
