- part_id: SEL-2488
  kind: device
  description: GPS Clock with Antenna and accessories (SNTP/IRIG-B), 125VDC redundant, 100mbps SFP ports
    redundant
  make: SEL
  verified: confirmed
  datasheet:
    full_name: SEL-2488 Satellite-Synchronized Network Clock
    manufacturer: Schweitzer Engineering Laboratories (SEL)
    summary: 1U GPS/GLONASS substation clock with IRIG-B, NTP and optional IEEE 1588 PTP grandmaster,
      optional redundant hot-swappable PSU
    power:
      input: 'SEL-9330-A: 125-250 VDC or 120-240 VAC, 50/60 Hz (range 88-300 VDC / 85-264 VAC); SEL-9330-C:
        24-48 VDC (19.2-60 VDC)'
      redundant_psu: true
      max_w: 45
    ratings:
      psu_burden: SEL-9330-A < 45 W (DC) / < 75 VA (AC); SEL-9330-C < 42 W
      time_protocols: IRIG-B (B002/B004 demodulated, B122/B124 modulated), NTPv4, optional PTP IEEE 1588-2008
        (C37.238-2011/2017, IEC/IEEE 61850-9-3), PRP (IEC 62439-3)
      holdover_oscillator: TCXO standard; OCXO option
      gnss: GPS/GLONASS via SEL-9524B antenna
    ports:
    - '4 rear 10/100 Mbps Ethernet in pairs: 10/100BASE-T RJ45, 100BASE-FX multimode LC (2 km) or 100BASE-LX10
      single-mode LC (15 km)'
    - 1 front RJ45 management port
    - '8 rear BNC time outputs (TO1-TO8): demodulated IRIG-B / pulse; TO1-TO4 can be modulated IRIG-B'
    - 1 DB-9 (COM1) IRIG-B/PPS output, 5 V TTL, 50 mA
    - 1 BNC IRIG-B input
    - optional 10 MHz SMA frequency outputs
    - TNC antenna input
    dimensions_mm:
      h: 43.7
      w: 482.5
      d: 248.6
    rack_units: 1
    weight_kg: 2.8
    mounting: 19-inch rack (1U); panel-mount version 80.0 x 502.9 x 248.8 mm
    operating_temp_c:
      min: -40
      max: 85
    certifications:
    - IEEE 1613-2009 Class 2
    - IEC 61850-3:2013
    - IEC 60255
    - UL 61010-1 (UL file 220228)
    - CE
    - UKCA
    - RCM
    - FCC Part 15 Class A
    ordering_code_decoded:
      '2488': SEL-2488 base model
      '#J544': 'SEL configured-part hash; not decodable. The public ordering sheet''s option positions
        are: time protocols (0 = IRIG-B+NTP, P = adds PTP), mounting (R rack / P panel), PSU A (C 24/48
        VDC, A 125/250 VDC/VAC), PSU B (X none, C, A), ETH1-2 and ETH3-4 (1 copper, 2 100BASE-FX MM, 3
        100BASE-LX10 SM), holdover (A TCXO, B OCXO), antenna kit, conformal coat (X/1).'
    datasheet_url: https://selinc.com/api/download/105748
    product_url: https://selinc.com/products/2488/
    notes: BOM 50 W is plausible for two PSUs fitted, but the data sheet gives only per-PSU limits (<
      45 W DC each). The BOM text says "100 Mb SFP ports", but SEL documents describe fixed LC fiber ports
      (100BASE-FX / LX10) ordered in pairs, not SFP cages; correct the BOM wording. For 125 VDC dual feed,
      order PSU A = A and PSU B = A. The SEL-9524B antenna, C961 cables, 915900139 surge kit and 915900043
      pipe-mount kit are separate line items in this BOM.
  alternatives:
  - make: Meinberg
    manufacturer: Meinberg Funkuhren GmbH & Co. KG
    tiers:
      low:
        model: microSyncHR
        ordering_code: microSyncHR
        description: Compact IEEE 1588 PTP grandmaster and NTP server with GNSS receiver and IRIG/pulse
