- part_id: RST2228-L1-24MM
  kind: device
  description: LAN-{lan} Industrial Ethernet switch (Level-1) (24 MM FO Ports)
  make: Ruggedcom
  verified: confirmed
  datasheet:
    full_name: SIMATIC NET RUGGEDCOM RST2228 managed Layer 2 19" rack switch with 10 Gbit/s uplinks
    manufacturer: Siemens
    summary: Level-1 (bay) RST2228 with 6 x RMM2942-4LC2 modules = 24 x 100BASE-FX multimode LC ports
      plus 4 x 1/10G SFP+ uplinks.
    power:
      input: 88-300 VDC / 85-264 VAC (HV PSU, code C); dual redundant
      redundant_psu: true
      max_w: 77
    ratings:
      total_ports: 28
      uplinks: 4 x 1/10 Gbit/s SFP+ (fixed, slot 0)
      layer: L2, IEEE 1588 v2
      degree_of_protection: IP40
    ports:
    - 4 x 1/10GBASE-X SFP+ uplinks (fixed)
    - 'Slots 1-6 (B-G): RMM2942-4LC2, 4 x LC each = 24 x 100BASE-FX multimode, 1300 nm'
    dimensions_mm:
      h: 44.45
      w: 440
      d: 345
    rack_units: 1
    weight_kg: 8.0
    mounting: 19" rack (rack + panel mount kit, digit 5)
    operating_temp_c:
      min: -40
      max: 85
    certifications:
    - IEC 61850-3
    - IEEE 1613
    - IEC 61000-6-2
    - CSA/UL 60950
    - CE
    ordering_code_decoded:
      6GK6222-6AB00: RUGGEDCOM RST2228 (non-PoE) base unit
      digit 13 = 5: 19" rack mounting kit + panel mount kit
      digit 14 = C: 'PSU 1: 88-300 VDC / 85-264 VAC, screw terminal'
      digit 15 = C: 'PSU 2: 88-300 VDC / 85-264 VAC, screw terminal (redundant)'
      digit 16 = 0: Standard (no conformal coating)
      A05: 'INVALID: option A is the service panel location and only A00 (front) or A01 (rear) exist.
        Probably meant A00.'
      B05: 'Slot 1: RMM2942-4LC2, 4 x LC, 100BASE-FX MM 1300 nm'
      C05: 'Slot 2: RMM2942-4LC2'
      D05: 'Slot 3: RMM2942-4LC2'
      E05: 'Slot 4: RMM2942-4LC2'
