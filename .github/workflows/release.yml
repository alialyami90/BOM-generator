name: Release

# Builds the Windows installer and publishes it (plan M11, ADR 0009).
#
#   - Version tags (v0.1.0) build, smoke-test, and attach
#     bomgen-setup-<version>.exe (and the default .bomlib, once M8 makes one)
#     to a GitHub Release. The tag must match bomgen.__version__.
#   - Pull requests that touch packaging, and manual runs, build and smoke-test
#     only; the installer is kept as a workflow artifact.
#
# Not part of ci-status (ADR 0006): it runs only for packaging changes and tags.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "src/bomgen/app/**"
      - "data/library/**"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  installer:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[app]" -r packaging/requirements.txt

      - name: Resolve version
        id: version
        run: |
          $version = python -c "import bomgen; print(bomgen.__version__)"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($tag -ne $version) {
              Write-Error "Tag v$tag does not match bomgen.__version__ $version"
              exit 1
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Freeze with PyInstaller
        run: |
          pyinstaller packaging/bomgen.spec --noconfirm --clean
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Smoke-test the frozen app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $out = & "dist\bomgen\bomgen.exe" --version
          if ($LASTEXITCODE -or $out -ne "bomgen $env:VERSION") {
            Write-Error "bomgen.exe --version gave '$out' (exit $LASTEXITCODE)"
            exit 1
          }
          # Exit 2 means "bomgen.cli not in this build yet" (M1); once it exists --help must work.
          $ErrorActionPreference = "Continue"  # a native command's stderr must not abort here
          $help = & "dist\bomgen\bomgen.exe" --help 2>&1
          $expected = if (Test-Path src\bomgen\cli.py) { 0 } else { 2 }
          $helpExit = $LASTEXITCODE
          Write-Output "bomgen.exe --help exited $helpExit (expected $expected): $help"
          if ($helpExit -ne $expected) { Write-Error "bomgen.exe --help exited $helpExit"; exit 1 }
          $global:LASTEXITCODE = 0  # an expected non-zero exit must not leak out as the step's result
          # Loads the whole example (models, YAML, library) from the frozen bundle; this
          # becomes `bomgen build` once M7 adds it.
          $validated = & "dist\bomgen\bomgen.exe" validate examples\project.yaml 2>&1
          $validateExit = $LASTEXITCODE
          Write-Output "bomgen.exe validate exited ${validateExit}: $validated"
          if ($validateExit -ne 0 -or "$validated" -notmatch "^OK:") { Write-Error "validate failed"; exit 1 }
          $global:LASTEXITCODE = 0
          # Builds the example substation's workbook from the frozen bundle: the first output
          # line is the workbook path, the rest is the check report.
          $buildDir = Join-Path $env:RUNNER_TEMP "frozen-build"
          $built = @(& "dist\bomgen\bomgen.exe" build examples\project.yaml --out $buildDir)
          $buildExit = $LASTEXITCODE
          Write-Output "bomgen.exe build exited ${buildExit}: $($built -join "`n")"
          if ($buildExit -ne 0 -or -not $built) { Write-Error "build failed"; exit 1 }
          $workbook = [string]$built[0]
          if ($workbook -notlike "*.xlsx" -or -not (Test-Path $workbook)) { Write-Error "build printed '$workbook' first, which is not a workbook"; exit 1 }
          $checks = [IO.Path]::ChangeExtension($workbook, ".checks.json")
          if (-not (Test-Path $checks)) { Write-Error "build wrote no $checks"; exit 1 }
          if (($built -join "`n") -notmatch "\b0 failed\b") { Write-Error "the check report does not say '0 failed'"; exit 1 }
          $global:LASTEXITCODE = 0
          # Imports every bomgen module from the frozen bundle (bomgen.app.launcher.self_test).
          $app = Start-Process "dist\bomgen\BOM Generator.exe" -ArgumentList "--self-test" -Wait -PassThru
          Write-Output "BOM Generator.exe --self-test exited $($app.ExitCode)"
          if ($app.ExitCode) { Write-Error "BOM Generator.exe --self-test exited $($app.ExitCode)"; exit 1 }

          # Open the real window (WebView2 on the runner) and wait for it to show.
          # run_window exits 1 at once when the UI, WebView2 or pywebview is missing.
          $env:BOMGEN_NO_DIALOGS = "1"
          $window = Start-Process "dist\bomgen\BOM Generator.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          $title = ""
          while ((Get-Date) -lt $deadline) {
            if ($window.HasExited) { Write-Error "The window exited with $($window.ExitCode) before showing"; exit 1 }
            $window.Refresh()
            $title = $window.MainWindowTitle
            if ($window.MainWindowHandle -ne 0 -and $title) { break }
            Start-Sleep -Milliseconds 500
          }
          taskkill /PID $window.Id /T /F | Out-Null
          Remove-Item Env:BOMGEN_NO_DIALOGS
          Write-Output "Window title: '$title'"
          if ($title -ne "BOM Generator") { Write-Error "The window never showed (title '$title')"; exit 1 }
          exit 0

      - name: Build the default device library
        run: |
          # The package the installer ships and the first start imports: the shipped library
          # (data/library/psa-devices.yaml, plan Q38). Name and version must match `library:`
          # in examples/project.yaml (tests/unit/test_packaging.py).
          New-Item -ItemType Directory -Force out | Out-Null
          & "dist\bomgen\bomgen.exe" library pack data\library\psa-devices.yaml `
            --name psa-devices --version 1.1.0 --add data\device-db --out out\default.bomlib `
            --notes "Alternatives as library parts (alt groups, low/mid/high); datasheet inrush and input voltage ranges; DC-rated MCB, aux contact, terminal block, busbar and housekeeping brand sets."
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path out\default.bomlib)) { Write-Error "out\default.bomlib was not written"; exit 1 }

      - name: Compile the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # No unpinned download here: a release must not change with upstream.
            Write-Error "Inno Setup 6 not found at $iscc; the runner image no longer ships it. Pin an installer version here."
            exit 1
          }
          & $iscc "/DAppVersion=$env:VERSION" packaging\bomgen.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Smoke-test install and uninstall (per user)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          function Fail($message) { Write-Error $message; exit 1 }
          $silent = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"

          $setup = Start-Process "out\installer\bomgen-setup-$env:VERSION.exe" -Wait -PassThru `
            -ArgumentList ($silent + "/LOG=$PWD\out\installer\install.log")
          if ($setup.ExitCode) { Fail "Setup exited $($setup.ExitCode)" }

          $dir = Join-Path $env:LOCALAPPDATA "Programs\BOM Generator"
          $exe = Join-Path $dir "BOM Generator.exe"
          foreach ($file in $exe, "$dir\bomgen.exe", "$dir\unins000.exe") {
            if (-not (Test-Path $file)) { Fail "Missing $file" }
          }
          $out = & "$dir\bomgen.exe" --version
          if ($out -ne "bomgen $env:VERSION") { Fail "Installed bomgen.exe --version gave '$out'" }
          $app = Start-Process $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($app.ExitCode) { Fail "Installed BOM Generator.exe --self-test exited $($app.ExitCode)" }
          if (-not (Test-Path "$dir\library\default.bomlib")) { Fail "The installer did not ship library\default.bomlib" }
          function Show-Window($label) {
            $window = Start-Process $exe -PassThru
            $deadline = (Get-Date).AddSeconds(60)
            $title = ""
            while ((Get-Date) -lt $deadline) {
              if ($window.HasExited) { Fail "${label}: the window exited with $($window.ExitCode) before showing" }
              $window.Refresh()
              $title = $window.MainWindowTitle
              if ($window.MainWindowHandle -ne 0 -and $title) { break }
              Start-Sleep -Milliseconds 500
            }
            taskkill /PID $window.Id /T /F | Out-Null
            if ($title -ne "BOM Generator") { Fail "${label}: the window never showed (title '$title')" }
          }
          function Snapshot($path) {
            (Get-ChildItem $path -Recurse -File | Sort-Object FullName |
              ForEach-Object { "$($_.FullName) $($_.Length) $($_.LastWriteTimeUtc.Ticks)" }) -join "`n"
          }
          # First start: the default library the installer ships lands in an empty store.
          $env:BOMGEN_LIBRARY_HOME = Join-Path $env:RUNNER_TEMP "first-start-home"
          $env:BOMGEN_NO_DIALOGS = "1"
          Show-Window "First start"
          $listing = (& "$dir\bomgen.exe" library list) -join "`n"
          if ($listing -notmatch "psa-devices\s+1\.1\.0 \(active\)") { Fail "Default library missing after the first start: $listing" }
          $before = Snapshot $env:BOMGEN_LIBRARY_HOME
          # Reinstall over the top and start again: the store must stay exactly as it was.
          $again = Start-Process "out\installer\bomgen-setup-$env:VERSION.exe" -Wait -PassThru -ArgumentList $silent
          if ($again.ExitCode) { Fail "Reinstall exited $($again.ExitCode)" }
          Show-Window "Second start"
          if ((Snapshot $env:BOMGEN_LIBRARY_HOME) -ne $before) { Fail "The library store changed on the second start" }
          Remove-Item Env:BOMGEN_LIBRARY_HOME, Env:BOMGEN_NO_DIALOGS
          # The double-click path: open a .bomlib with the installed app (as Explorer does),
          # then read it back with the installed CLI. Unattended, so no message box.
          $env:BOMGEN_LIBRARY_HOME = Join-Path $env:RUNNER_TEMP "bomlib-home"
          $env:BOMGEN_NO_DIALOGS = "1"
          $package = Join-Path $env:RUNNER_TEMP "ci-library.bomlib"
          & "$dir\bomgen.exe" library pack examples\library.yaml --name ci-library --version 1.0.0 --out $package
          if ($LASTEXITCODE) { Fail "bomgen.exe library pack exited $LASTEXITCODE" }
          $import = Start-Process $exe -ArgumentList "`"$package`"" -Wait -PassThru
          if ($import.ExitCode) { Fail "Opening a .bomlib with the app exited $($import.ExitCode)" }
          $validated = & "$dir\bomgen.exe" validate examples\project.yaml 2>&1
          if ($LASTEXITCODE -ne 0 -or "$validated" -notmatch "^OK:") { Fail "Installed bomgen.exe validate gave: $validated" }
          $buildDir = Join-Path $env:RUNNER_TEMP "installed-build"
          $built = @(& "$dir\bomgen.exe" build examples\project.yaml --out $buildDir)
          if ($LASTEXITCODE -ne 0 -or -not $built) { Fail "Installed bomgen.exe build exited ${LASTEXITCODE}: $($built -join "`n")" }
          $workbook = [string]$built[0]
          if ($workbook -notlike "*.xlsx" -or -not (Test-Path $workbook)) { Fail "Installed build printed '$workbook' first, which is not a workbook" }
          $checks = [IO.Path]::ChangeExtension($workbook, ".checks.json")
          if (-not (Test-Path $checks)) { Fail "Installed build wrote no $checks" }
          if (($built -join "`n") -notmatch "\b0 failed\b") { Fail "The installed build's check report does not say '0 failed'" }
          $listing = (& "$dir\bomgen.exe" library list) -join "`n"
          if ($listing -notmatch "ci-library") { Fail "Imported library missing from: $listing" }
          Remove-Item Env:BOMGEN_LIBRARY_HOME, Env:BOMGEN_NO_DIALOGS
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\BOM Generator.lnk"
          if (-not (Test-Path $shortcut)) { Fail "Missing Start-menu shortcut $shortcut" }

          $classes = "HKCU:\Software\Classes"
          $progId = (Get-ItemProperty "$classes\.bomlib").'(default)'
          if ($progId -ne "bomgen.library") { Fail ".bomlib maps to '$progId'" }
          $command = (Get-ItemProperty "$classes\bomgen.library\shell\open\command").'(default)'
          if ($command -ne "`"$exe`" `"%1`"") { Fail "Open command is '$command'" }
          $projId = (Get-ItemProperty "$classes\.bomproj").'(default)'
          if ($projId -ne "bomgen.project") { Fail ".bomproj maps to '$projId'" }
          $projCommand = (Get-ItemProperty "$classes\bomgen.project\shell\open\command").'(default)'
          if ($projCommand -ne "`"$exe`" `"%1`"") { Fail ".bomproj open command is '$projCommand'" }

          Start-Process "$dir\unins000.exe" -ArgumentList $silent -Wait
          # The uninstaller re-launches itself from %TEMP%; wait for it to finish.
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path "$dir\unins000.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          Start-Sleep 2
          if (Test-Path $exe) { Fail "Uninstall left $exe" }
          if (Test-Path "$classes\bomgen.library") { Fail "Uninstall left the bomgen.library ProgID" }
          if (Test-Path "$classes\.bomlib") { Fail "Uninstall left the .bomlib key" }
          foreach ($left in "bomgen.project", ".bomproj") {
            if (Test-Path "$classes\$left") { Fail "Uninstall left the $left key" }
          }
          if (Test-Path $shortcut) { Fail "Uninstall left the Start-menu shortcut" }
          Write-Output "Installed, verified and uninstalled bomgen-setup-$env:VERSION.exe"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: bomgen-setup-${{ steps.version.outputs.version }}
          path: |
            out/installer/bomgen-setup-*.exe
            out/*.bomlib
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-log
          path: out/installer/install.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: installer
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bomgen-setup-${{ needs.installer.outputs.version }}
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.installer.outputs.version }}
        run: |
          mapfile -t assets < <(find release -type f \( -name '*.exe' -o -name '*.bomlib' \))
          prerelease=()
          # PEP 440 pre-releases (0.2.0rc1, 0.2.0b1, 0.2.0.dev1) carry a letter.
          [[ "$VERSION" =~ [a-z] ]] && prerelease=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A release made by hand in the GitHub UI for this tag: attach to it, keep its notes.
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "BOM Generator $VERSION" \
              --notes-file packaging/release-notes.md --generate-notes "${prerelease[@]}"
          fi
