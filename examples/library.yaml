# yaml-language-server: $schema=../schemas/library.schema.json
#
# Device library and commodity catalogues for the example project, transcribed from
# the example workbook (hidden master sheets 'Panel 1', 'Panel 2', 'Panel 3', 'Aux';
# unit watts from 'Power Consumption' column I). Values the workbook does not give
# carry a trailing "# ASSUMED".
#
# Conventions:
# - ordering_code is set whenever the workbook's ORDERING CODE cell (column G) has a
#   value, even when it equals MODEL; it is left out where column G is blank.
# - Descriptions are the workbook's column C text with trailing spaces trimmed;
#   {lan} replaces the LAN letter and {purpose} the panel-specific phrase.
# - Numeric codes (2903685, 730076, ...) are quoted so they stay strings.
#
# Part ids by BOM group (spec: "How each panel BOM groups its materials"):
#   B  main equipment   FOPP-96SM (children FOPP-SPOOL, FOPP-SPLICE-HOLDER,
#                       FOPP-PIGTAIL-LC-SM), RST2228-L2, RST2228-L1-24MM, SEL-2730M-EXT,
#                       SEL-3555-GW, FGR-60F, SEL-2488, SEL-3555-RTAC,
#                       SEL-2240 (children SEL-2242, SEL-2241, SEL-2243, SEL-2244-2),
#                       SEL-3355, NAP-F23, KEYTEK-KBM
#   C  accessories      SFP-1G-LX-SM, SFP-1G-SX-MM, SFP-100M-FX-MM, FR-TRAN-SX,
#                       PL1U12NEBK, SEL-C607
#   D  housekeeping     SZ2500-LAMP, SK3243-FAN, SK3238-FILTER, SK3110-TH,
#                       IPR-2903685 (children IPR-BASE-2900934, IPR-SUPP-2900944,
#                       IPR-BRACKET-2900954), COD-NEG-IRND150F12, COD-POS-IRMD150F12,
#                       SOCKET-730076
#   loose material      NAP-K55, LPA37-696, ZENON-V12, MS-OFFICE-2021,
#                       ANN-DISPLAY-CABLE-10M, ANN-USB-CABLE-10M, MON-DVI-CABLE-3M,
#                       MON-USB-CABLE-3M, FO-PATCH-CORDS; GPS clock loose items
#                       SEL-9524B, SEL-C961-050, SEL-915900139, SEL-C961-025,
#                       SEL-915900043
#   E-H                 catalogues below (MCBs, aux contact, terminal blocks, busbars)

devices:
  # --- Group B: network cabinets (example workbook, 'Panel 1'!B4:H12) -----------------

  - part_id: FOPP-96SM  # 'Panel 1' row 4: PSA1-FOPP-CCR-A01
    category: patch_panel
    height_u: 1  # Ali (Q33)
    make: Hubbell
    model: FEUR96LCSM
    ordering_code: FEUR96LCSM
    description_template: "LC, 96 core SM FOPP for {purpose}"
    tag_type: FOPP
    tag_pattern: "{prefix}-FOPP-CCR-{lan}01"
    cores: 96
    children:
      - { part_id: FOPP-SPOOL, qty: 1 }
      - { part_id: FOPP-SPLICE-HOLDER, qty: 1 }
      - { part_id: FOPP-PIGTAIL-LC-SM, qty: cores }

  - part_id: FOPP-SPOOL  # 'Panel 1' row 5
    category: component
    make: Hubbell
    description_template: "Fiber Management Spool"

  - part_id: FOPP-SPLICE-HOLDER  # 'Panel 1' row 6
    category: component
    make: Hubbell
    description_template: "Splice Holder"

  - part_id: FOPP-PIGTAIL-LC-SM  # 'Panel 1' row 7 (qty 96 = cores)
    category: component
    make: Hubbell
    model: FPLCS3SM
    ordering_code: FPLCS3SM
    description_template: "LC Single Mode pigtails"

  - part_id: RST2228-L2  # 'Panel 1' row 8: PSA1-L2-ESW-A01
    category: network_switch
    height_u: 1  # A3 (PR #18)
    make: Ruggedcom
    model: RST-2228
    ordering_code: "6GK6222-6AB00-5CC0-Z A00+B06+C06+D06+E06+F06+G00"
    description_template: "LAN-{lan} Industrial Ethernet switch (Level-2)"
    tag_type: ESW
    purdue_level: L2
    supply_type: VDC
    voltage_v: 125
    unit_power_w: 77  # 'Power Consumption'!I7
    load_type: CONTINUOUS
    power_supplies: 2
    min_branch_mcb_a: 2
    hwio_points: 1  # 'Panel 1'!H8
    ports:  # A3 (PR #18); the workbook gives no port inventory. Slot 6 is blank (G00).
      - { count: 20, speed: 1G, kind: sfp_slot, usable_for: any }  # slots 1-5, 100M/1G
      - { count: 4, speed: 1G, kind: sfp_slot, usable_for: uplink }  # slot 0, SFP+
      # Slot 0 takes 1/10G SFP+ (A3 records 10G); written 1G because 1G SFPs are fitted
      # in the example, and M1c matches port groups by speed.

  - part_id: RST2228-L1-24MM  # 'Panel 1' row 9: PSA1-L1-ESW-A11 to A16
    # The spec's library example (Inputs the tool needs -> 1. Device library).
    category: network_switch
    height_u: 1  # A3 (PR #18)
    make: Ruggedcom
    model: RST-2228
    ordering_code: "6GK6222-6AB00-5CC0-Z A05+B05+C05+D05+E05+F05+G05"
    description_template: "LAN-{lan} Industrial Ethernet switch (Level-1) (24 MM FO Ports)"
    tag_type: ESW
    purdue_level: L1
    supply_type: VDC
    voltage_v: 125
    unit_power_w: 77  # 'Power Consumption'!I8
    load_type: CONTINUOUS
    power_supplies: 2
    min_branch_mcb_a: 2
    alarm_on_branch_mcb: false
    hwio_points: 1  # the panel row overrides this with 10 ('Panel 1'!H9, plan Q5)
    ports:
      - { count: 24, speed: 100M, media: MM, kind: fixed, usable_for: ied }
      - { count: 4, speed: 1G, kind: sfp_slot, usable_for: uplink }  # SFP+ (1/10G), 1G fitted
      # Written 1G, not A3's 10G: 1G SFPs are fitted, and M1c matches groups by speed.
    excluded_from_power: false

  - part_id: SEL-2730M-EXT  # 'Panel 1' row 10: PSA1-EXT-ESW-A
    category: network_switch
    height_u: 1  # A3 (PR #18)
    make: SEL
    model: SEL-2730M
    ordering_code: "2730M#2CF9"
    description_template: "LAN-{lan} Industrial Ethernet switch (EXT) (16 MM Ports, 4 RJ45)"
    tag_type: ESW
    purdue_level: EXT
    supply_type: VDC
    voltage_v: 125
    unit_power_w: 45  # 'Power Consumption'!I9
    load_type: CONTINUOUS
    power_supplies: 2
    min_branch_mcb_a: 2
    hwio_points: 1  # 'Panel 1'!H10
    ports:  # A3 (PR #18)
      - { count: 4, speed: 1G, kind: sfp_slot, usable_for: uplink }  # ports 1-4
      - { count: 4, speed: 1G, media: RJ45, kind: fixed, usable_for: any }  # ports 5-8
      - { count: 16, speed: 100M, media: MM, kind: fixed, usable_for: ied }  # ports 9-24
    # NOTE: the issued sheets '1'!F10:G10 and '2'!F10:G10 list a Ruggedcom RST-2228
    # (...E01+F00+G00) here; this follows the master 'Panel 1', which Power Consumption reads.

  - part_id: SEL-3555-GW  # 'Panel 1' row 11: PSA1-DHPCC-GW-1
