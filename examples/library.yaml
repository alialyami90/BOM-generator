    height_u: 3  # A3 (PR #18)
    make: SEL
    model: SEL-3555
    ordering_code: "3555#0KVC"
    description_template: "Protocol Gateway {purpose}"
    tag_type: GW
    tag_pattern: "{prefix}-DHPCC-GW-{lan_index}"
    supply_type: VDC
    voltage_v: 125
    unit_power_w: 73  # 'Power Consumption'!I10
    load_type: CONTINUOUS
    power_supplies: 2
    min_branch_mcb_a: 2

  - part_id: FGR-60F  # 'Panel 1' row 12: PSA1-EXT-FW-A
    category: firewall
