# yaml-language-server: $schema=../schemas/project.schema.json
#
# The example project (ADR 0012): project info, the library it is built with, the
# document register and the defaults its substations inherit. Transcribed from the
# example workbook's page headers and footers. Values the workbook does not give carry
# a trailing "# ASSUMED".

project:
  id: jfgp2-pkg3
  name: "JAFURAH JFGP2 PKG.3 UTILITIES, SULFUR and INTERCONNECTING SYSTEMS"
  # logo: assets/logo.png  # ASSUMED: add the company logo PNG here (binary, added separately)

library:  # the installed library; `file` loads this folder's copy instead
  name: psa-devices
  version: 1.14.0
  file: library.yaml

documents:  # the register: every key names its substation (Q24)
  - key: gis01-bom  # the BOM sheets of every gis01 panel
    substation: gis01
    doc_no: VD-EL0009-861GISPSA-001
    rev: "02"
    issue_date: 2026-10-28  # ASSUMED
  - key: gis01-power  # Power Consumption
    substation: gis01
    doc_no: VD-EL0009-861GISPSA-002
    rev: "00"
    issue_date: 2026-10-28  # ASSUMED
  - key: gis01-heat  # Heat Dissipation and Heat Calculations
    substation: gis01
    doc_no: VD-EL0009-861GISPSA-003
    rev: "00"
    issue_date: 2026-10-28  # ASSUMED

defaults:  # inherited key by key by every substation
  constants:  # spec: Inputs the tool needs -> 3. Project settings
    dc_voltage_v: 125
    ac_voltage_v: 230
    power_margin: 0.25
    current_factor: 1.3
    btu_per_w: 3.41
    t_max_c: 35
    t_int_c: 25
    air_constant_m3k_per_wh: 4.1
    steel_coefficient_w_per_m2c: 5.5
    min_main_mcb_a: 6

  spares:  # ADR 0013; every spare is an input
    port_fraction: 0.20
    sfp_per_l1: 3
    dc_branches_per_feed: 3
    ac_branches: 1
    rack_u_reserved: 10

substations:
  - substations/gis01/substation.yaml
